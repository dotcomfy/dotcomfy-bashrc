# Tmux config, git version

# Cutting down the timeout when doing things like ctrl-a esc to enter scrollback
set -sg escape-time 10

# Also need to set correct $TERM. This seems to work:
# TERM=xterm-256color
set -g default-terminal "tmux-256color"

# Now the default, since 2.3
# set-option -g utf8 on
# Lots of scrollback.
set-option -g history-limit 40960

# Enable status bar
set-option -g status on

set-option -g status-style bg=blue,fg=white

# Disabling the left status, to start window list from the far left
set-option -g status-left-length 0
set-option -g status-left ""

# Main status is window list
# set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format '#[fg=white,bold]#[bg=red] #I:#W '
set-window-option -g window-status-format ' #I:#W '

# Right side: user @ host + date & time, with a bit of colour, matching what I've used in Gnu Screen for decades.
set-option -g status-right "#[fg=cyan] #(whoami)@#h | #[fg=yellow,bold]%a %e %b  %H:%M"
#set-option -g status-right " #(whoami)@#h | %Y-%m-%d %H:%M"

# Refresh every X seconds
set-option -g status-interval 5

# Shortcuts like on a physical server, press except it's Alt-0 for window 0, etc.
# I experimented with using ctrl-f1, etc, but that only work for some of the function keys
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Next/previous
bind space next-window
bind bspace previous-window

#set-option -g status-interval 5
#set-option -g automatic-rename on
#set-option -g automatic-rename-format '#(basename "#{pane_current_path}")'

# Reload tmux.config
#bind-key r source-file ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display-message "Local tmux config reloaded!"

# Additions to make tmux behave like GNU Screen
# Use C-a as prefix
unbind C-b
set -g prefix C-a

# Send literal C-a with C-a a
unbind a
bind a send-prefix

# Switch to last window with C-a C-a
unbind C-a
bind C-a last-window

# Split panes (Screen uses | and -)
bind | split-window -h  # C-a | splits horizontally (into vertical panes)
bind - split-window -v  # C-a - splits vertically (into horizontal panes)

# Switch panes
bind h select-pane -L   # C-a h : move to left pane
bind j select-pane -D   # C-a j : move to pane below
bind k select-pane -U   # C-a k : move to pane above
bind l select-pane -R   # C-a l : move to right pane

# Create new window
bind c new-window       # C-a c : new window

# Change window
bind n next-window      # C-a n : next window
bind p previous-window  # C-a p : previous window

# Kill pane/window
bind x kill-pane        # C-a x : kill current pane
bind & kill-window      # C-a & : kill current window

# Rename window
bind A command-prompt "rename-window %%"

# List / choose windows
bind w list-windows     # C-a w : list windows
bind '"' choose-tree     # C-a w : list windows

# Detach session
bind d detach           # C-a d : detach session

# Enter copy mode
bind [ copy-mode        # C-a [ : just like screen

# Paste buffer
bind ] paste-buffer     # C-a ] : paste buffer

# Scrollback/Enter copy mode quickly with C-a Escape (as before)
# bind-key -n C-a Esc copy-mode
bind Escape copy-mode \; display-message "Welcome to hacker's treasure zoo"

# Needed on RHEL8, to use vi keys in copy mode
setw -g mode-keys vi
